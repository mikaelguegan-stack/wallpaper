<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OSCAR Bubblemap Wallpaper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #121824 0%, #07090e 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }

        .bubble {
            position: absolute;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3), inset 0 0 10px rgba(0, 255, 204, 0.2);
            background: #151c28;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            will-change: transform;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .bubble:active {
            transform: scale(0.92) !important;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
        }

        .bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .bubble.empty {
            border: 2px dashed #4a5568;
            background: rgba(21, 28, 40, 0.6);
            color: #00ffcc;
            font-size: 32px;
            font-weight: 300;
        }

        #back-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            background: rgba(21, 28, 40, 0.8);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            border-radius: 30px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
            z-index: 20;
            display: none;
        }

        #add-btn {
            position: fixed;
            bottom: 35px;
            right: 35px;
            background: linear-gradient(135deg, #00ffcc 0%, #00b388 100%);
            color: #07090e;
            border: none;
            border-radius: 50px;
            padding: 14px 28px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.4);
            z-index: 10;
            transition: transform 0.2s ease;
        }

        #add-btn:active {
            transform: scale(0.95);
        }

        #file-input {
            display: none;
        }

        #fullscreen-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #07090e;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <button id="back-btn" onclick="goBackToRoot()">← Retour</button>
    <div id="canvas-container"></div>
    <button id="add-btn" onclick="triggerAddGlobal()">+ Ajouter</button>
    <input type="file" id="file-input" accept="image/*" onchange="addNewImage(event)">

    <div id="fullscreen-view"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const fullscreenView = document.getElementById('fullscreen-view');
        const backBtn = document.getElementById('back-btn');
        
        let currentParentId = null;
        let activeBubbleForUpload = null;

        // Correspondance exacte avec les noms de fichiers de ton dépôt GitHub
        const appData = {
            root: [
                { id: 'folder-shibus', type: 'folder', src: 'Shibus.png' },
                { id: 'folder-ryoshi', type: 'folder', src: 'Ryoshi.png' },
                { id: 'folder-oscar', type: 'folder', src: 'Oscar.png' },
                { id: 'folder-collar', type: 'folder', src: 'Collar.png' }
            ],
            folders: {
                'folder-shibus': [{ type: 'empty' }, { type: 'empty' }],
                'folder-ryoshi': [{ type: 'empty' }],
                'folder-oscar': [{ type: 'empty' }, { type: 'empty' }],
                'folder-collar': [{ type: 'empty' }]
            }
        };

        let activeBubblesPhysics = [];

        function renderScene() {
            container.innerHTML = '';
            activeBubblesPhysics = [];

            let itemsToDisplay = currentParentId === null ? appData.root : appData.folders[currentParentId];
            backBtn.style.display = currentParentId === null ? 'none' : 'block';

            itemsToDisplay.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'bubble';

                if (item.type === 'empty') {
                    el.classList.add('empty');
                    el.innerHTML = '+';
                    el.onclick = () => openEmptySlot(item);
                } else {
                    el.innerHTML = `<img src="${item.src}" alt="" onerror="this.onerror=null; this.parentNode.innerHTML='⚠️';">`;
                    if (item.type === 'folder') {
                        el.onclick = () => enterFolder(item.id);
                    } else {
                        el.onclick = () => openImageFullscreen(item.src);
                    }
                }

                el.oncontextmenu = (ev) => deleteItem(ev, item);
                container.appendChild(el);

                const x = 60 + (index * 120) % Math.max(window.innerWidth - 120, 100);
                const y = 120 + Math.floor(index / 3) * 120;

                activeBubblesPhysics.push({
                    element: el,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2
                });
            });
        }

        function updatePhysics() {
            const maxX = window.innerWidth - 85;
            const maxY = window.innerHeight - 85;

            activeBubblesPhysics.forEach(item => {
                item.x += item.vx;
                item.y += item.vy;

                if (item.x <= 0) { item.x = 0; item.vx *= -1; }
                if (item.x >= maxX) { item.x = maxX; item.vx *= -1; }
                if (item.y <= 0) { item.y = 0; item.vy *= -1; }
                if (item.y >= maxY) { item.y = maxY; item.vy *= -1; }

                item.element.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
            });

            requestAnimationFrame(updatePhysics);
        }

        function enterFolder(folderId) {
            currentParentId = folderId;
            renderScene();
        }

        function goBackToRoot() {
            currentParentId = null;
            renderScene();
        }

        function openEmptySlot(item) {
            activeBubbleForUpload = item;
            document.getElementById('file-input').click();
        }

        function triggerAddGlobal() {
            activeBubbleForUpload = null;
            document.getElementById('file-input').click();
        }

        function addNewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    if (activeBubbleForUpload) {
                        activeBubbleForUpload.type = 'image';
                        activeBubbleForUpload.src = imageUrl;
                        activeBubbleForUpload = null;
                    } else {
                        if (currentParentId === null) {
                            appData.root.push({ type: 'image', src: imageUrl });
                        } else {
                            appData.folders[currentParentId].push({ type: 'image', src: imageUrl });
                        }
                    }
                    renderScene();
                }
                reader.readAsDataURL(file);
            }
        }

        function openImageFullscreen(src) {
            fullscreenView.style.backgroundImage = `url(${src})`;
            fullscreenView.style.display = 'block';
            container.style.opacity = '0';
            backBtn.style.display = 'none';
        }

        function deleteItem(event, item) {
            event.preventDefault();
            if (confirm("Supprimer cet élément ?")) {
                if (currentParentId === null) {
                    const idx = appData.root.indexOf(item);
                    if (idx !== -1) appData.root.splice(idx, 1);
                } else {
                    const list = appData.folders[currentParentId];
                    const idx = list.indexOf(item);
                    if (idx !== -1) list.splice(idx, 1);
                }
                renderScene();
            }
        }

        let touchStartY = 0;
        fullscreenView.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
        fullscreenView.addEventListener('touchend', (e) => { if (touchStartY - e.changedTouches[0].clientY > 40) resetView(); }, { passive: true });
        fullscreenView.onclick = resetView;

        function resetView() {
            fullscreenView.style.display = 'none';
            container.style.opacity = '1';
            if (currentParentId !== null) backBtn.style.display = 'block';
        }

        renderScene();
        requestAnimationFrame(updatePhysics);
    </script>
</body>
</html>
