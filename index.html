<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>$OSCAR Live Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0e14;
        }

        .wallpaper-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        .wallpaper-img {
            position: absolute;
            width: 110%;
            height: 110%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            will-change: opacity, transform;
            transform: translate3d(0, 0, 0);
        }

        .wallpaper-img.active {
            opacity: 1;
        }

        /* Petit HUD discret Oscar x Ryu */
        .crypto-hud {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 24, 38, 0.6);
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            text-align: center;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .hud-title {
            font-size: 10px;
            letter-spacing: 2px;
            color: #00ffcc;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 1px;
        }
    </style>
</head>
<body>

    <div class="wallpaper-container" id="wallpaperContainer">
        <!-- Les images seront injectées dynamiquement ici -->
        <div class="crypto-hud">
            <div class="hud-title">$OSCAR x @Ryu</div>
            <div class="hud-value" id="counter">Tap to switch</div>
        </div>
    </div>

    <script>
        // LISTE DES IMAGES : Pour ajouter une image, dépose-la simplement dans ton dépôt GitHub 
        // et ajoute son nom/lien ici ! N'importe qui peut le faire en modifiant ce tableau.
        const imageFiles = [
            "image1.jpg",
            "image2.jpg"
            // Ajoute d'autres images ici, ex: "image3.jpg", "image4.png", etc.
        ];

        const container = document.getElementById('wallpaperContainer');
        const counter = document.getElementById('counter');
        let currentIndex = 0;
        let imgElements = [];

        // Génération automatique des balises images dans le HTML
        imageFiles.forEach((src, index) => {
            const img = document.createElement('img');
            img.src = src;
            img.className = `wallpaper-img ${index === 0 ? 'active' : ''}`;
            container.insertBefore(img, container.firstChild); // Insère derrière le HUD
            imgElements.push(img);
        });

        // Changement d'image instantané au toucher (Tactile ultra réactif)
        container.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            
            if (imgElements.length === 0) return;

            imgElements[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % imgElements.length;
            imgElements[currentIndex].classList.add('active');

            counter.innerText = `Image ${currentIndex + 1} / ${imgElements.length}`;
        }, { passive: false });

        // Effet de parallaxe léger avec le gyroscope du téléphone
        window.addEventListener('deviceorientation', (e) => {
            let tiltX = e.gamma;
            let tiltY = e.beta;

            if (tiltX !== null && tiltY !== null && imgElements[currentIndex]) {
                let x = Math.max(-10, Math.min(10, tiltX));
                let y = Math.max(-10, Math.min(10, tiltY));
                imgElements[currentIndex].style.transform = `translate3d(${-x * 0.4}px, ${-y * 0.4}px, 0) scale(1.05)`;
            }
        }, true);
    </script>
</body>
</html>
