<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fond d'Écran Interactif</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117; /* Couleur de fond sombre */
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wallpaper {
      width: 100%;
      height: 100%;
      /* 
         'contain' conserve l'image entière sans la couper.
         Remplace par 'cover' si tu veux que l'image remplisse tout l'écran.
      */
      object-fit: contain; 
      transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
      opacity: 1;
    }
    .wallpaper.hidden {
      opacity: 0;
      transform: scale(0.96);
    }
    .hint {
      position: absolute;
      bottom: 24px;
      color: rgba(255, 255, 255, 0.3);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <img id="bg-img" class="wallpaper" src="" alt="Wallpaper">
    <div class="hint">Appuie pour changer</div>
  </div>

  <script>
    // Ajoute ici la liste de tes images (chemins relatifs ou URLs web)
    const images = [
      "image1.png",
      "image2.png",
      "image3.png"
    ];

    let currentIndex = 0;
    const imgElement = document.getElementById('bg-img');
    const container = document.getElementById('app');

    function changeImage() {
      if (images.length === 0) return;

      // Effet de transition
      imgElement.classList.add('hidden');

      setTimeout(() => {
        currentIndex = (currentIndex + 1) % images.length;
        imgElement.src = images[currentIndex];
        imgElement.classList.remove('hidden');
      }, 300);
    }

    // Charger la première image
    if (images.length > 0) {
      imgElement.src = images[0];
    }

    // Détection du clic / toucher sur tout l'écran
    container.addEventListener('click', changeImage);
  </script>
</body>
</html>
