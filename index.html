<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>$OSCAR Wallpaper</title>
    <style>
        /* Force un fond opaque visible sur Android */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030508 !important;
            overflow: hidden;
            font-family: sans-serif;
        }

        .screen-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #030508;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
        }

        /* Conteneur des images affichées */
        .gallery {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            padding: 20px;
            max-width: 90vw;
        }

        .image-card {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            background: #111;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bouton d'ajout d'image visible en bas */
        .upload-btn {
            position: absolute;
            bottom: 40px;
            background: #00ffcc;
            color: #030508;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.4);
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div class="screen-wrapper" id="wrapper">
        <div class="gallery" id="galleryContainer">
            <!-- Chargement direct de tes images GitHub -->
            <div class="image-card"><img src="image1.png" alt="1"></div>
            <div class="image-card"><img src="image2.png" alt="2"></div>
            <div class="image-card"><img src="image3.png" alt="3"></div>
        </div>

        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">+ Ajouter une image</button>
        <input type="file" id="fileInput" accept="image/*" onchange="addNewImage(event)">
    </div>

    <script>
        function addNewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const gallery = document.getElementById('galleryContainer');
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    card.appendChild(img);
                    gallery.appendChild(card);
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
