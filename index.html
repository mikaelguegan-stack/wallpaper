<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSCAR Bubblemap Wallpaper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            font-family: sans-serif;
        }

        /* Conteneur principal façon Bubblemap */
        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            box-sizing: border-box;
            transition: opacity 0.5s ease;
        }

        /* Style des bulles */
        .bubble {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #1a2233;
            flex-shrink: 0;
        }

        .bubble:hover {
            transform: scale(1.15);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.8);
        }

        .bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Bouton pour ajouter une image */
        #add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #00ffcc;
            color: #0b0e14;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            z-index: 10;
        }

        #file-input {
            display: none;
        }

        /* Vue plein écran lorsque l'image est sélectionnée comme fond */
        #fullscreen-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: none;
            z-index: 5;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 50px;
        }

        .hint {
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
    </style>
</head>
<body>

    <!-- Grille des bulles -->
    <div id="canvas-container" id="bubblemap">
        <!-- Bulles par défaut (images d'exemple ou tokens OSCAR) -->
        <div class="bubble" onclick="setWallpaper('https://picsum.photos/seed/1/800/1200')"><img src="https://picsum.photos/seed/1/200/200" alt=""></div>
        <div class="bubble" onclick="setWallpaper('https://picsum.photos/seed/2/800/1200')"><img src="https://picsum.photos/seed/2/200/200" alt=""></div>
        <div class="bubble" onclick="setWallpaper('https://picsum.photos/seed/3/800/1200')"><img src="https://picsum.photos/seed/3/200/200" alt=""></div>
    </div>

    <!-- Bouton d'ajout d'image -->
    <button id="add-btn" onclick="document.getElementById('file-input').click()">+ Ajouter</button>
    <input type="file" id="file-input" accept="image/*" onchange="addNewImage(event)">

    <!-- Vue plein écran -->
    <div id="fullscreen-view" onclick="resetView()">
        <div class="hint">Balayer vers le haut pour revenir</div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const fullscreenView = document.getElementById('fullscreen-view');
        let touchStartY = 0;

        // Fonction pour mettre l'image en fond d'écran
        function setWallpaper(imageUrl) {
            fullscreenView.style.backgroundImage = `url(${imageUrl})`;
            fullscreenView.style.display = 'flex';
            container.style.opacity = '0';
        }

        // Gestion du balayage vers le haut (Swipe Up) pour retourner au Bubblemap
        fullscreenView.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        fullscreenView.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            // Si l'utilisateur a balayé vers le haut (différence négative importante)
            if (touchStartY - touchEndY > 50) {
                resetView();
            }
        });

        function resetView() {
            fullscreenView.style.display = 'none';
            container.style.opacity = '1';
        }

        // Permettre à l'utilisateur d'ajouter sa propre image depuis son appareil
        function addNewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    
                    // Crée une nouvelle bulle dynamiquement
                    const newBubble = document.createElement('div');
                    newBubble.className = 'bubble';
                    newBubble.innerHTML = `<img src="${imageUrl}" alt="">`;
                    newBubble.onclick = () => setWallpaper(imageUrl);
                    
                    container.appendChild(newBubble);
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
