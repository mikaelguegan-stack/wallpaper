<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OSCAR Bubblemap Wallpaper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            font-family: sans-serif;
            user-select: none;
            touch-action: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transition: opacity 0.5s ease;
        }

        .bubble {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            cursor: pointer;
            background: #1a2233;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
        }

        .bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .bubble.empty {
            border: 3px dashed #666;
            background: rgba(26, 34, 51, 0.5);
            color: #888;
            font-size: 24px;
            font-weight: bold;
        }

        #add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #00ffcc;
            color: #0b0e14;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            z-index: 10;
        }

        #file-input {
            display: none;
        }

        #fullscreen-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0b0e14;
            display: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="bubble" oncontextmenu="deleteBubble(event, this)"><img src="https://picsum.photos/seed/1/200/200" alt=""></div>
        <div class="bubble empty" oncontextmenu="deleteBubble(event, this)">+</div>
        <div class="bubble empty" oncontextmenu="deleteBubble(event, this)">+</div>
    </div>

    <button id="add-btn" onclick="triggerAddGlobal()">+ Ajouter une bulle</button>
    <input type="file" id="file-input" accept="image/*" onchange="addNewImage(event)">

    <div id="fullscreen-view" onclick="resetView()"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const fullscreenView = document.getElementById('fullscreen-view');
        let touchStartY = 0;
        let activeBubble = null;
        const bubblesData = [];

        // Gestion du déplacement tactile et du clic
        let draggedItem = null;
        let offsetX = 0, offsetY = 0;
        let isDragging = false;
        let startTouchX = 0, startTouchY = 0;

        function initBubbles() {
            const elements = document.querySelectorAll('.bubble');
            elements.forEach((el, index) => {
                const x = 50 + (index * 120) % (window.innerWidth - 100);
                const y = 100 + Math.floor(index / 3) * 120;
                
                const item = {
                    element: el,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: (Math.random() - 0.5) * 1.2,
                    isBeingDragged: false
                };

                setupTouchEvents(item);
                bubblesData.push(item);
            });
        }

        function setupTouchEvents(item) {
            let el = item.element;

            el.addEventListener('pointerdown', (e) => {
                isDragging = false;
                draggedItem = item;
                startTouchX = e.clientX;
                startTouchY = e.clientY;
                offsetX = e.clientX - item.x;
                offsetY = e.clientY - item.y;
                item.isBeingDragged = true;
                el.setPointerCapture(e.pointerId);
            });

            el.addEventListener('pointermove', (e) => {
                if (draggedItem === item) {
                    let dx = e.clientX - startTouchX;
                    let dy = e.clientY - startTouchY;
                    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                        isDragging = true; // C'est un mouvement (glissé)
                    }
                    item.x = e.clientX - offsetX;
                    item.y = e.clientY - offsetY;
                }
            });

            el.addEventListener('pointerup', (e) => {
                if (draggedItem === item) {
                    item.isBeingDragged = false;
                    // Donne une petite impulsion au lancer selon le mouvement
                    item.vx = (e.clientX - startTouchX) * 0.1;
                    item.vy = (e.clientY - startTouchY) * 0.1;
                    
                    // Si on n'a pas bougé, c'est considéré comme un clic simple !
                    if (!isDragging) {
                        handleBubbleClick(item);
                    }
                    draggedItem = null;
                }
            });
        }

        function updatePhysics() {
            const maxX = window.innerWidth - 80;
            const maxY = window.innerHeight - 80;

            bubblesData.forEach(item => {
                if (!item.isBeingDragged) {
                    item.x += item.vx;
                    item.y += item.vy;

                    // Friction naturelle pour ralentir doucement le lancer
                    item.vx *= 0.99;
                    item.vy *= 0.99;

                    // Relance un tout petit peu si la bulle s'arrête complètement
                    if (Math.abs(item.vx) < 0.2) item.vx = (Math.random() - 0.5) * 1.2;
                    if (Math.abs(item.vy) < 0.2) item.vy = (Math.random() - 0.5) * 1.2;

                    // Rebond sur les bords
                    if (item.x <= 0) { item.x = 0; item.vx *= -1; }
                    if (item.x >= maxX) { item.x = maxX; item.vx *= -1; }
                    if (item.y <= 0) { item.y = 0; item.vy *= -1; }
                    if (item.y >= maxY) { item.y = maxY; item.vy *= -1; }
                }

                item.element.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
            });

            requestAnimationFrame(updatePhysics);
        }

        initBubbles();
        requestAnimationFrame(updatePhysics);

        function handleBubbleClick(item) {
            if (item.element.classList.contains('empty')) {
                activeBubble = item.element;
                document.getElementById('file-input').click();
            } else {
                const img = item.element.querySelector('img');
                if (img) {
                    fullscreenView.style.backgroundImage = `url(${img.src})`;
                    fullscreenView.style.display = 'block';
                    container.style.opacity = '0';
                }
            }
        }

        function triggerAddGlobal() {
            activeBubble = null;
            document.getElementById('file-input').click();
        }

        function addNewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    
                    if (activeBubble) {
                        activeBubble.classList.remove('empty');
                        activeBubble.innerHTML = `<img src="${imageUrl}" alt="">`;
                        activeBubble = null;
                    } else {
                        const newDiv = document.createElement('div');
                        newDiv.className = 'bubble';
                        newDiv.innerHTML = `<img src="${imageUrl}" alt="">`;
                        newDiv.oncontextmenu = (ev) => deleteBubble(ev, newDiv);
                        container.appendChild(newDiv);

                        const newItem = {
                            element: newDiv,
                            x: window.innerWidth / 2,
                            y: window.innerHeight / 2,
                            vx: (Math.random() - 0.5) * 1.5,
                            vy: (Math.random() - 0.5) * 1.5,
                            isBeingDragged: false
                        };
                        setupTouchEvents(newItem);
                        bubblesData.push(newItem);
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function deleteBubble(event, bubbleElement) {
            event.preventDefault();
            if (confirm("Voulez-vous supprimer cette bulle ?")) {
                const index = bubblesData.findIndex(item => item.element === bubbleElement);
                if (index !== -1) {
                    bubblesData.splice(index, 1);
                }
                bubbleElement.remove();
            }
        }

        fullscreenView.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        fullscreenView.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            if (touchStartY - touchEndY > 50) {
                resetView();
            }
        });

        function resetView() {
            fullscreenView.style.display = 'none';
            container.style.opacity = '1';
        }
    </script>
</body>
</html>
