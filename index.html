<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSCAR Bubblemap Wallpaper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            font-family: sans-serif;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            box-sizing: border-box;
            transition: opacity 0.5s ease;
        }

        .bubble {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #1a2233;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .bubble:hover {
            transform: scale(1.15);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.8);
        }

        .bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bubble.empty {
            border: 3px dashed #666;
            background: rgba(26, 34, 51, 0.5);
            color: #888;
            font-size: 24px;
            font-weight: bold;
        }

        .bubble.empty:hover {
            border-color: #00ffcc;
            color: #00ffcc;
        }

        #add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #00ffcc;
            color: #0b0e14;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            z-index: 10;
        }

        #file-input {
            display: none;
        }

        #fullscreen-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="bubble" onclick="handleBubbleClick(this)" oncontextmenu="deleteBubble(event, this)"><img src="https://picsum.photos/seed/1/200/200" alt=""></div>
        <div class="bubble empty" onclick="handleBubbleClick(this)" oncontextmenu="deleteBubble(event, this)">+</div>
        <div class="bubble empty" onclick="handleBubbleClick(this)" oncontextmenu="deleteBubble(event, this)">+</div>
    </div>

    <button id="add-btn" onclick="triggerAddGlobal()">+ Ajouter une bulle</button>
    <input type="file" id="file-input" accept="image/*" onchange="addNewImage(event)">

    <div id="fullscreen-view" onclick="resetView()"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const fullscreenView = document.getElementById('fullscreen-view');
        let touchStartY = 0;
        let activeBubble = null;

        function handleBubbleClick(bubbleElement) {
            if (bubbleElement.classList.contains('empty')) {
                // Si la bulle est vide, on l'ouvre pour y mettre une image
                activeBubble = bubbleElement;
                document.getElementById('file-input').click();
            } else {
                // Si elle est pleine, on met l'image en fond d'écran plein écran
                const img = bubbleElement.querySelector('img');
                if (img) {
                    fullscreenView.style.backgroundImage = `url(${img.src})`;
                    fullscreenView.style.display = 'block';
                    container.style.opacity = '0';
                }
            }
        }

        function triggerAddGlobal() {
            activeBubble = null; // null signifie création d'une nouvelle bulle
            document.getElementById('file-input').click();
        }

        function addNewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    
                    if (activeBubble) {
                        // Remplit la bulle vide existante
                        activeBubble.classList.remove('empty');
                        activeBubble.innerHTML = `<img src="${imageUrl}" alt="">`;
                        activeBubble = null;
                    } else {
                        // Crée une toute nouvelle bulle
                        const newBubble = document.createElement('div');
                        newBubble.className = 'bubble';
                        newBubble.innerHTML = `<img src="${imageUrl}" alt="">`;
                        newBubble.onclick = () => handleBubbleClick(newBubble);
                        newBubble.oncontextmenu = (ev) => deleteBubble(ev, newBubble);
                        container.appendChild(newBubble);
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        // Effacer une bulle (via un appui long / clic droit)
        function deleteBubble(event, bubbleElement) {
            event.preventDefault(); // Empêche le menu contextuel du navigateur
            if (confirm("Voulez-vous supprimer cette bulle ?")) {
                bubbleElement.remove();
            }
        }

        // Balayage vers le haut (Swipe Up) pour revenir au Bubblemap
        fullscreenView.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        fullscreenView.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            if (touchStartY - touchEndY > 50) {
                resetView();
            }
        });

        function resetView() {
            fullscreenView.style.display = 'none';
            container.style.opacity = '1';
        }
    </script>
</body>
</html>
