<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OSCAR Bubblemap Wallpaper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }

        .bubble {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            background: #1a2233;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            will-change: transform;
            touch-action: none;
        }

        .bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .bubble.empty {
            border: 3px dashed #666;
            background: rgba(26, 34, 51, 0.5);
            color: #888;
            font-size: 24px;
            font-weight: bold;
        }

        #add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #00ffcc;
            color: #0b0e14;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            z-index: 10;
        }

        #file-input {
            display: none;
        }

        #fullscreen-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0b0e14;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="bubble" oncontextmenu="deleteBubble(event, this)"><img src="https://picsum.photos/seed/1/200/200" alt=""></div>
        <div class="bubble empty" oncontextmenu="deleteBubble(event, this)">+</div>
        <div class="bubble empty" oncontextmenu="deleteBubble(event, this)">+</div>
    </div>

    <button id="add-btn" onclick="triggerAddGlobal()">+ Ajouter une bulle</button>
    <input type="file" id="file-input" accept="image/*" onchange="addNewImage(event)">

    <div id="fullscreen-view"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const fullscreenView = document.getElementById('fullscreen-view');
        let activeBubble = null;
        const bubblesData = [];

        function initBubbles() {
            const elements = document.querySelectorAll('.bubble');
            elements.forEach((el, index) => {
                const x = 50 + (index * 110) % (window.innerWidth - 100);
                const y = 100 + Math.floor(index / 3) * 110;
                
                const item = {
                    element: el,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    isBeingDragged: false
                };

                setupTouchHandlers(item);
                bubblesData.push(item);
            });
        }

        function setupTouchHandlers(item) {
            let el = item.element;
            let startX = 0, startY = 0;
            let lastTouchX = 0, lastTouchY = 0;
            let hasMoved = false;

            el.addEventListener('touchstart', (e) => {
                let touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
                hasMoved = false;
                item.isBeingDragged = true;
                item.vx = 0;
                item.vy = 0;
            }, { passive: true });

            el.addEventListener('touchmove', (e) => {
                if (!item.isBeingDragged) return;
                let touch = e.touches[0];
                let currentX = touch.clientX;
                let currentY = touch.clientY;

                let dx = currentX - startX;
                let dy = currentY - startY;

                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    hasMoved = true;
                }

                // Calcule la vitesse instantanée pour le lancer au moment du lâcher
                item.vx = currentX - lastTouchX;
                item.vy = currentY - lastTouchY;

                item.x += dx;
                item.y += dy;

                startX = currentX;
                startY = currentY;
                lastTouchX = currentX;
                lastTouchY = currentY;
            }, { passive: true });

            el.addEventListener('touchend', (e) => {
                if (!item.isBeingDragged) return;
                item.isBeingDragged = false;

                if (!hasMoved) {
                    // Tapotement simple -> Ouvre l'image ou la boîte d'ajout
                    openBubble(item);
                } else {
                    // Lâcher avec mouvement -> Conserve l'élan du lancer de doigt
                    // On bride la vitesse max pour éviter qu'elle sorte de l'écran trop violemment
                    item.vx = Math.max(Math.min(item.vx * 1.2, 15), -15);
                    item.vy = Math.max(Math.min(item.vy * 1.2, 15), -15);
                }
            });
        }

        function updatePhysics() {
            const maxX = window.innerWidth - 80;
            const maxY = window.innerHeight - 80;

            bubblesData.forEach(item => {
                if (!item.isBeingDragged) {
                    item.x += item.vx;
                    item.y += item.vy;

                    // Ralentissement progressif (frottement de l'air)
                    item.vx *= 0.96;
                    item.vy *= 0.96;

                    // Relance automatique douce si la bulle s'arrête complètement
                    if (Math.abs(item.vx) < 0.2 && Math.abs(item.vy) < 0.2) {
                        item.vx = (Math.random() - 0.5) * 1.5;
                        item.vy = (Math.random() - 0.5) * 1.5;
                    }

                    // Rebond sur les bords de l'écran
                    if (item.x <= 0) { item.x = 0; item.vx *= -1; }
                    if (item.x >= maxX) { item.x = maxX; item.vx *= -1; }
                    if (item.y <= 0) { item.y = 0; item.vy *= -1; }
                    if (item.y >= maxY) { item.y = maxY; item.vy *= -1; }
                }

                item.element.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
            });

            requestAnimationFrame(updatePhysics);
        }

        initBubbles();
        requestAnimationFrame(updatePhysics);

        function openBubble(item) {
            if (item.element.classList.contains('empty')) {
                activeBubble = item.element;
                document.getElementById('file-input').click();
            } else {
                const img = item.element.querySelector('img');
                if (img) {
                    fullscreenView.style.backgroundImage = `url(${img.src})`;
                    fullscreenView.style.display = 'block';
                    container.style.opacity = '0';
                }
            }
        }

        function triggerAddGlobal() {
            activeBubble = null;
            document.getElementById('file-input').click();
        }

        function addNewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    
                    if (activeBubble) {
                        activeBubble.classList.remove('empty');
                        activeBubble.innerHTML = `<img src="${imageUrl}" alt="">`;
                        activeBubble = null;
                    } else {
                        const newDiv = document.createElement('div');
                        newDiv.className = 'bubble';
                        newDiv.innerHTML = `<img src="${imageUrl}" alt="">`;
                        newDiv.oncontextmenu = (ev) => deleteBubble(ev, newDiv);
                        container.appendChild(newDiv);

                        const newItem = {
                            element: newDiv,
                            x: window.innerWidth / 2,
                            y: window.innerHeight / 2,
                            vx: (Math.random() - 0.5) * 2,
                            vy: (Math.random() - 0.5) * 2,
                            isBeingDragged: false
                        };
                        setupTouchHandlers(newItem);
                        bubblesData.push(newItem);
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function deleteBubble(event, bubbleElement) {
            event.preventDefault();
            if (confirm("Supprimer cette bulle ?")) {
                const index = bubblesData.findIndex(item => item.element === bubbleElement);
                if (index !== -1) bubblesData.splice(index, 1);
                bubbleElement.remove();
            }
        }

        // --- Gestion du balayage vers le haut (Swipe Up) pour quitter l'image ---
        let touchStartY = 0;

        fullscreenView.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        fullscreenView.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            if (touchStartY - touchEndY > 40) {
                resetView();
            }
        }, { passive: true });

        fullscreenView.onclick = resetView;

        function resetView() {
            fullscreenView.style.display = 'none';
            container.style.opacity = '1';
        }
    </script>
</body>
</html>
