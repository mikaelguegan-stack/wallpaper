<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>$OSCAR Bubblemap Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #05080f;
            font-family: sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .hud {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 24, 38, 0.7);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            color: #00ffcc;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="hud">$OSCAR // Bubblemap Node</div>
    <canvas id="bubbleCanvas"></canvas>

    <script>
        // ==========================================
        // VOS IMAGES EN .PNG (Modifiable par n'importe qui)
        // ==========================================
        const imagesList = [
            "image1.png",
            "image2.png",
            "image3.png"
        ];

        const canvas = document.getElementById('bubbleCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let bubbles = [];
        let loadedImages = [];

        imagesList.forEach((src, index) => {
            const img = new Image();
            img.src = src;
            img.onload = () => {
                loadedImages.push(img);
                bubbles.push({
                    x: Math.random() * (width - 150) + 75,
                    y: Math.random() * (height - 250) + 100,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    radius: 45,
                    img: img,
                    id: index
                });
            };
        });

        let tilt = { x: 0, y: 0 };
        let touchPos = { x: null, y: null, active: false };

        function animate() {
            ctx.fillStyle = '#05080f';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < bubbles.length; i++) {
                for (let j = i + 1; j < bubbles.length; j++) {
                    let dx = bubbles[i].x - bubbles[j].x;
                    let dy = bubbles[i].y - bubbles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    ctx.beginPath();
                    ctx.moveTo(bubbles[i].x, bubbles[i].y);
                    ctx.lineTo(bubbles[j].x, bubbles[j].y);
                    ctx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }

            bubbles.forEach(b => {
                b.x += b.vx + (tilt.x * 0.1);
                b.y += b.vy + (tilt.y * 0.1);

                if (b.x - b.radius < 0 || b.x + b.radius > width) b.vx *= -1;
                if (b.y - b.radius < 0 || b.y + b.radius > height) b.vy *= -1;

                if (touchPos.active) {
                    let tdx = touchPos.x - b.x;
                    let tdy = touchPos.y - b.y;
                    let tdist = Math.sqrt(tdx * tdx + tdy * tdy);
                    if (tdist < 120) {
                        b.x += tdx * 0.03;
                        b.y += tdy * 0.03;
                    }
                }

                ctx.save();
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(b.img, b.x - b.radius, b.y - b.radius, b.radius * 2, b.radius * 2);
                ctx.restore();

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffcc';
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('pointerdown', (e) => {
            touchPos.x = e.clientX;
            touchPos.y = e.clientY;
            touchPos.active = true;
        });

        window.addEventListener('pointermove', (e) => {
            if (touchPos.active) {
                touchPos.x = e.clientX;
                touchPos.y = e.clientY;
            }
        });

        window.addEventListener('pointerup', () => {
            touchPos.active = false;
        });

        window.addEventListener('deviceorientation', (e) => {
            if (e.gamma !== null && e.beta !== null) {
                tilt.x = Math.max(-6, Math.min(6, e.gamma / 3));
                tilt.y = Math.max(-6, Math.min(6, e.beta / 3));
            }
        });
    </script>
</body>
</html>
