<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OSCAR Bubblemap Wallpaper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            font-family: sans-serif;
            user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Utilisation d'un bouton HTML natif : le moyen le plus fiable sur mobile pour capturer les clics */
        .bubble {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            background: #1a2233;
            padding: 0;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .bubble.empty {
            border: 3px dashed #666;
            background: rgba(26, 34, 51, 0.5);
            color: #888;
            font-size: 24px;
            font-weight: bold;
        }

        #add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #00ffcc;
            color: #0b0e14;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            z-index: 10;
        }

        #file-input {
            display: none;
        }

        #fullscreen-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0b0e14;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <!-- Bulles converties en balises <button> pour garantir l'événement tactile natif -->
        <button class="bubble" onclick="openBubble(this)" oncontextmenu="deleteBubble(event, this)"><img src="https://picsum.photos/seed/1/200/200" alt=""></button>
        <button class="bubble empty" onclick="openBubble(this)" oncontextmenu="deleteBubble(event, this)">+</button>
        <button class="bubble empty" onclick="openBubble(this)" oncontextmenu="deleteBubble(event, this)">+</button>
    </div>

    <button id="add-btn" onclick="triggerAddGlobal()">+ Ajouter une bulle</button>
    <input type="file" id="file-input" accept="image/*" onchange="addNewImage(event)">

    <div id="fullscreen-view" onclick="resetView()"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const fullscreenView = document.getElementById('fullscreen-view');
        let activeBubble = null;
        const bubblesData = [];

        function initBubbles() {
            const elements = document.querySelectorAll('.bubble');
            elements.forEach((el, index) => {
                const x = 50 + (index * 110) % (window.innerWidth - 100);
                const y = 100 + Math.floor(index / 3) * 110;
                
                bubblesData.push({
                    element: el,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5
                });
            });
        }

        // Animation fluide des bulles en arrière-plan
        function updatePhysics() {
            const maxX = window.innerWidth - 80;
            const maxY = window.innerHeight - 80;

            bubblesData.forEach(item => {
                item.x += item.vx;
                item.y += item.vy;

                // Rebond sur les bords
                if (item.x <= 0) { item.x = 0; item.vx *= -1; }
                if (item.x >= maxX) { item.x = maxX; item.vx *= -1; }
                if (item.y <= 0) { item.y = 0; item.vy *= -1; }
                if (item.y >= maxY) { item.y = maxY; item.vy *= -1; }

                item.element.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
            });

            requestAnimationFrame(updatePhysics);
        }

        initBubbles();
        requestAnimationFrame(updatePhysics);

        // Gestion propre de l'ouverture de l'image au clic direct
        function openBubble(bubbleElement) {
            if (bubbleElement.classList.contains('empty')) {
                activeBubble = bubbleElement;
                document.getElementById('file-input').click();
            } else {
                const img = bubbleElement.querySelector('img');
                if (img) {
                    fullscreenView.style.backgroundImage = `url(${img.src})`;
                    fullscreenView.style.display = 'block';
                    container.style.opacity = '0';
                }
            }
        }

        function triggerAddGlobal() {
            activeBubble = null;
            document.getElementById('file-input').click();
        }

        function addNewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    
                    if (activeBubble) {
                        activeBubble.classList.remove('empty');
                        activeBubble.innerHTML = `<img src="${imageUrl}" alt="">`;
                        activeBubble = null;
                    } else {
                        const newBtn = document.createElement('button');
                        newBtn.className = 'bubble';
                        newBtn.innerHTML = `<img src="${imageUrl}" alt="">`;
                        newBtn.onclick = function() { openBubble(newBtn); };
                        newBtn.oncontextmenu = function(ev) { deleteBubble(ev, newBtn); };
                        container.appendChild(newBtn);

                        bubblesData.push({
                            element: newBtn,
                            x: window.innerWidth / 2,
                            y: window.innerHeight / 2,
                            vx: (Math.random() - 0.5) * 2,
                            vy: (Math.random() - 0.5) * 2
                        });
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function deleteBubble(event, bubbleElement) {
            event.preventDefault();
            if (confirm("Supprimer cette bulle ?")) {
                const index = bubblesData.findIndex(item => item.element === bubbleElement);
                if (index !== -1) bubblesData.splice(index, 1);
                bubbleElement.remove();
            }
        }

        function resetView() {
            fullscreenView.style.display = 'none';
            container.style.opacity = '1';
        }
    </script>
</body>
</html>
