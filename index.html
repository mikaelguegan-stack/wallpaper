<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>$OSCAR Bubblemap Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #05080f;
            font-family: sans-serif;
        }

        .bubblemap-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Les bulles d'images */
        .bubble {
            position: absolute;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
            background: #111;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            cursor: pointer;
        }

        .bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Réseau de lignes SVG dynamique */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .link-line {
            stroke: rgba(0, 255, 204, 0.35);
            stroke-width: 2;
            stroke-dasharray: 4 2; /* Effet de données/flux réseau */
        }

        /* HUD minimaliste $OSCAR */
        .hud {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 24, 38, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.4);
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            color: #00ffcc;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="bubblemap-container" id="container">
        <!-- SVG dynamique pour le réseau -->
        <svg id="svgContainer"></svg>
    </div>

    <div class="hud">$OSCAR // Bubblemap Cluster</div>

    <script>
        // ==========================================
        // LISTE DES IMAGES : N'importe qui peut en rajouter 
        // simplement en ajoutant "nom.png" ici et dans le dépôt GitHub !
        // ==========================================
        const imagesList = [
            "image1.png",
            "image2.png",
            "image3.png"
            // Ex: "image4.png", "image5.png", etc.
        ];

        const container = document.getElementById('container');
        const svgContainer = document.getElementById('svgContainer');
        
        let width = window.innerWidth;
        let height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
        });

        let bubbles = [];
        let lines = [];

        // Génération automatique des éléments DOM pour chaque image
        imagesList.forEach((src, index) => {
            // Création de la bulle HTML
            const bubbleEl = document.createElement('div');
            bubbleEl.className = 'bubble';
            
            const imgEl = document.createElement('img');
            imgEl.src = src;
            bubbleEl.appendChild(imgEl);
            container.appendChild(bubbleEl);

            // Position de départ aléatoire mais espacée
            bubbles.push({
                el: bubbleEl,
                x: Math.random() * (width - 150) + 75,
                y: Math.random() * (height - 250) + 100,
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                radius: 37.5 // Moitié de 75px
            });
        });

        // Génération des lignes de liaison du graphe (Style Bubblemap)
        for (let i = 0; i < bubbles.length; i++) {
            for (let j = i + 1; j < bubbles.length; j++) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("class", "link-line");
                svgContainer.appendChild(line);
                lines.push({ line: line, a: bubbles[i], b: bubbles[j] });
            }
        }

        let tiltX = 0, tiltY = 0;
        let touchX = null, touchY = null, isTouching = false;

        // Boucle de physique Bubblemap ultra-fluide (60 FPS)
        function animateBubblemap() {
            // 1. Mise à jour de la position et répulsion entre bulles (pour qu'elles ne se superforcent pas)
            for (let i = 0; i < bubbles.length; i++) {
                let b1 = bubbles[i];

                // Ajout de l'influence du gyroscope
                b1.vx += tiltX * 0.03;
                b1.vy += tiltY * 0.03;

                // Friction pour stabiliser la vitesse
                b1.vx *= 0.98;
                b1.vy *= 0.98;

                b1.x += b1.vx;
                b1.y += b1.vy;

                // Rebond sur les bords de l'écran
                if (b1.x < b1.radius || b1.x > width - b1.radius) { b1.vx *= -1; b1.x = Math.max(b1.radius, Math.min(width - b1.radius, b1.x)); }
                if (b1.y < b1.radius || b1.y > height - b1.radius - 50) { b1.vy *= -1; b1.y = Math.max(b1.radius, Math.min(height - b1.radius - 50, b1.y)); }

                // Répulsion entre bulles proches (Effet Bubblemap organique)
                for (let j = i + 1; j < bubbles.length; j++) {
                    let b2 = bubbles[j];
                    let dx = b2.x - b1.x;
                    let dy = b2.y - b1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    let minDist = b1.radius + b2.radius + 35; // Espace entre les bulles

                    if (dist < minDist && dist > 0) {
                        let force = (minDist - dist) / dist * 0.08;
                        b1.vx -= dx * force;
                        b1.vy -= dy * force;
                        b2.vx += dx * force;
                        b2.vy += dy * force;
                    }
                }

                // Interaction tactile (attire ou repousse légèrement vers le doigt)
                if (isTouching && touchX !== null) {
                    let tdx = touchX - b1.x;
                    let tdy = touchY - b1.y;
                    let tdist = Math.sqrt(tdx * tdx + tdy * tdy);
                    if (tdist < 180) {
                        b1.vx += tdx * 0.002;
                        b1.vy += tdy * 0.002;
                    }
                }

                // Application CSS GPU
                b1.el.style.transform = `translate3d(${b1.x - b1.radius}px, ${b1.y - b1.radius}px, 0)`;
            }

            // 2. Mise à jour des lignes de connexion du réseau
            lines.forEach(l => {
                l.line.setAttribute("x1", l.a.x);
                l.line.setAttribute("y1", l.a.y);
                l.line.setAttribute("x2", l.b.x);
                l.line.setAttribute("y2", l.b.y);
            });

            requestAnimationFrame(animateBubblemap);
        }
        requestAnimationFrame(animateBubblemap);

        // Gestion tactile
        window.addEventListener('pointerdown', (e) => {
            isTouching = true;
            touchX = e.clientX;
            touchY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (isTouching) {
                touchX = e.clientX;
                touchY = e.clientY;
            }
        });

        window.addEventListener('pointerup', () => {
            isTouching = false;
            touchX = null;
            touchY = null;
        });

        // Gyroscope
        window.addEventListener('deviceorientation', (e) => {
            if (e.gamma !== null && e.beta !== null) {
                tiltX = Math.max(-5, Math.min(5, e.gamma / 3));
                tiltY = Math.max(-5, Math.min(5, e.beta / 3));
            }
        });
    </script>
</body>
</html>
