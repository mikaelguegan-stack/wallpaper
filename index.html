<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>$OSCAR Bubblemaps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #030508;
        }

        .map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #030508;
        }
    </style>
</head>
<body>

    <div class="map-container">
        <!-- Remplace l'URL ci-dessous par l'adresse directe de ta map Bubblemaps si besoin -->
        <iframe src="https://app.bubblemaps.io/" allowfullscreen></iframe>
    </div>

</body>
</html>
