<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OSCAR Bubblemap Wallpaper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #121824 0%, #07090e 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }

        .bubble {
            position: absolute;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3), inset 0 0 10px rgba(0, 255, 204, 0.2);
            background: #151c28;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            will-change: transform;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .bubble:active {
            transform: scale(0.92) !important;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
        }

        .bubble img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .bubble.empty {
            border: 2px dashed #4a5568;
            background: rgba(21, 28, 40, 0.6);
            color: #00ffcc;
            font-size: 32px;
            font-weight: 300;
        }

        #add-btn {
            position: fixed;
            bottom: 35px;
            right: 35px;
            background: linear-gradient(135deg, #00ffcc 0%, #00b388 100%);
            color: #07090e;
            border: none;
            border-radius: 50px;
            padding: 14px 28px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.4);
            z-index: 10;
            transition: transform 0.2s ease;
        }

        #add-btn:active {
            transform: scale(0.95);
        }

        #file-input {
            display: none;
        }

        #fullscreen-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #07090e;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div class="bubble" onclick="openBubble(this)" oncontextmenu="deleteBubble(event, this)"><img src="https://picsum.photos/seed/1/200/200" alt=""></div>
        <div class="bubble empty" onclick="openBubble(this)" oncontextmenu="deleteBubble(event, this)">+</div>
        <div class="bubble empty" onclick="openBubble(this)" oncontextmenu="deleteBubble(event, this)">+</div>
    </div>

    <button id="add-btn" onclick="triggerAddGlobal()">+ Ajouter</button>
    <input type="file" id="file-input" accept="image/*" onchange="addNewImage(event)">

    <div id="fullscreen-view"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const fullscreenView = document.getElementById('fullscreen-view');
        let activeBubble = null;
        const bubblesData = [];

        function initBubbles() {
            const elements = document.querySelectorAll('.bubble');
            elements.forEach((el, index) => {
                const x = 50 + (index * 115) % (window.innerWidth - 100);
                const y = 120 + Math.floor(index / 3) * 115;
                
                bubblesData.push({
                    element: el,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 2.2,
                    vy: (Math.random() - 0.5) * 2.2
                });
            });
        }

        function updatePhysics() {
            const maxX = window.innerWidth - 85;
            const maxY = window.innerHeight - 85;

            bubblesData.forEach(item => {
                item.x += item.vx;
                item.y += item.vy;

                if (item.x <= 0) { item.x = 0; item.vx *= -1; }
                if (item.x >= maxX) { item.x = maxX; item.vx *= -1; }
                if (item.y <= 0) { item.y = 0; item.vy *= -1; }
                if (item.y >= maxY) { item.y = maxY; item.vy *= -1; }

                item.element.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
            });

            requestAnimationFrame(updatePhysics);
        }

        initBubbles();
        requestAnimationFrame(updatePhysics);

        function openBubble(bubbleElement) {
            if (bubbleElement.classList.contains('empty')) {
                activeBubble = bubbleElement;
                document.getElementById('file-input').click();
            } else {
                const img = bubbleElement.querySelector('img');
                if (img) {
                    fullscreenView.style.backgroundImage = `url(${img.src})`;
                    fullscreenView.style.display = 'block';
                    container.style.opacity = '0';
                }
            }
        }

        function triggerAddGlobal() {
            activeBubble = null;
            document.getElementById('file-input').click();
        }

        function addNewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    
                    if (activeBubble) {
                        activeBubble.classList.remove('empty');
                        activeBubble.innerHTML = `<img src="${imageUrl}" alt="">`;
                        activeBubble = null;
                    } else {
                        const newDiv = document.createElement('div');
                        newDiv.className = 'bubble';
                        newDiv.innerHTML = `<img src="${imageUrl}" alt="">`;
                        newDiv.onclick = function() { openBubble(newDiv); };
                        newDiv.oncontextmenu = function(ev) { deleteBubble(ev, newDiv); };
                        container.appendChild(newDiv);

                        bubblesData.push({
                            element: newDiv,
                            x: window.innerWidth / 2,
                            y: window.innerHeight / 2,
                            vx: (Math.random() - 0.5) * 2.2,
                            vy: (Math.random() - 0.5) * 2.2
                        });
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function deleteBubble(event, bubbleElement) {
            event.preventDefault();
            if (confirm("Supprimer cette bulle ?")) {
                const index = bubblesData.findIndex(item => item.element === bubbleElement);
                if (index !== -1) bubblesData.splice(index, 1);
                bubbleElement.remove();
            }
        }

        let touchStartY = 0;

        fullscreenView.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        fullscreenView.addEventListener('touchend', (e) => {
            let touchEndY = e.changedTouches[0].clientY;
            if (touchStartY - touchEndY > 40) {
                resetView();
            }
        }, { passive: true });

        fullscreenView.onclick = resetView;

        function resetView() {
            fullscreenView.style.display = 'none';
            container.style.opacity = '1';
        }
    </script>
</body>
</html>
