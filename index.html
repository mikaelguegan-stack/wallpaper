<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Live Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; /* Supprime le flash gris au clic sur Android */
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        .wallpaper-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wallpaper-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover; /* S'adapte parfaitement à l'écran sans déformer */
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            will-change: opacity, transform; /* Active l'accélération matérielle GPU */
            transform: translate3d(0, 0, 0); /* Force le rendu matériel */
        }

        .wallpaper-img.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="wallpaper-container" id="wallpaperContainer">
        <!-- Tes images ici -->
        <img src="image1.jpg" class="wallpaper-img active" alt="Wallpaper 1">
        <img src="image2.jpg" class="wallpaper-img" alt="Wallpaper 2">
        <img src="image3.jpg" class="wallpaper-img" alt="Wallpaper 3">
    </div>

    <script>
        const images = document.querySelectorAll('.wallpaper-img');
        let currentIndex = 0;
        const container = document.getElementById('wallpaperContainer');

        // Changement d'image instantané au premier contact tactile
        container.addEventListener('pointerdown', (e) => {
            e.preventDefault(); // Empêche les délais de double-tap/zoom du navigateur
            
            // Masque l'image actuelle
            images[currentIndex].classList.remove('active');
            
            // Passe à la suivante
            currentIndex = (currentIndex + 1) % images.length;
            
            // Affiche la nouvelle image de manière fluide
            images[currentIndex].classList.add('active');
        }, { passive: false });
    </script>
</body>
</html>
